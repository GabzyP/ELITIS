services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-elitis}
      POSTGRES_USER: ${PG_USER:-elitis}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD harus diisi di .env}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-elitis}
      MONGO_DB: ${MONGO_DB:-elitis}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/indexes.js:/docker-entrypoint-initdb.d/01-indexes.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pg_data:
  mongo_data:
